# Runs the project's checks (type check, lint, tests, static build and build verification)
# on every push to main and on every pull request, so a change that breaks the design rules
# or the build is flagged on GitHub before anyone relies on it.
#
# NOT ACTIVE YET: GitHub only runs workflows from .github/workflows/. To turn it on, follow
# "Automatic checks" in guides/ARCHITECTURE.md.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Type check, lint, tests, static build and build verification (see package.json "check").
      - run: bun run check
