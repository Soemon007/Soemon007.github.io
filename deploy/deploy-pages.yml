# Builds the site and publishes it to https://soemon007.github.io on every push to main,
# so changes made in Lovable go live without any manual copying.
#
# NOT ACTIVE YET: GitHub only runs workflows from .github/workflows/. To turn it on, follow
# "Turning on auto-deploy" in the README (move this file there and add the PAGES_DEPLOY_KEY secret).
# Without the secret the workflow still builds the site as a check, and skips the publish step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET_REPO: Soemon007/Soemon007.github.io
  SITE_URL: https://soemon007.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run build:static

      - name: Publish skipped (no deploy key)
        if: env.HAS_DEPLOY_KEY != 'true'
        run: echo "::warning::PAGES_DEPLOY_KEY is not set, so the site was built but not published. See README."

      - name: Check out the Pages repo
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: main
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: pages

      - name: Publish
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          rsync -a --delete --exclude='.git' --exclude='README.md' dist/ pages/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed, the live site is already up to date."
            exit 0
          fi
          git commit -m "Deploy portfolio (rehan-portfolio@${GITHUB_SHA::7})"
          git push origin HEAD:main

      # GitHub Pages occasionally leaves a deployment queued. Flag it instead of failing silently.
      - name: Confirm the new version is live
        if: env.HAS_DEPLOY_KEY == 'true'
        run: |
          expected=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          for i in $(seq 1 30); do
            if curl -fsSL "$SITE_URL/?cb=$RANDOM" | grep -q "$expected"; then
              echo "Live site is serving $expected"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::$SITE_URL is still serving the old build after 10 minutes. Open the repo's Actions tab, cancel the stuck 'pages build and deployment' run, and re-run it."
